<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty Space</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#526138" />
    <meta name="description" content="Beauty Space" />
    <meta property="og:title" content="Beauty Space" />
    <meta property="og:description" content="Beauty Space" />
    <meta property="og:image" content="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      @keyframes beautySpaceWiggle {
        0%, 100% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(-5deg) scale(1.03); }
        75% { transform: rotate(5deg) scale(1.03); }
      }
      .bs-loading-emblem {
        animation: beautySpaceWiggle 1.4s ease-in-out infinite;
        display: inline-block;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #FAF8F5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 9999;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #initial-loader p {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 12px;
        font-weight: 700;
        color: #526138;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="bs-loading-emblem">
          <svg
            width="42"
            height="42"
            viewBox="0 0 48 48"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="color: #526138;"
            aria-hidden="true"
          >
            <!-- Hoja Superior Izquierda (-38 deg) -->
            <g transform="translate(24, 24) rotate(-38) translate(0, -2)">
              <path
                d="M 0 0 C -5 -6, -6 -13, 0 -19 C 6 -13, 5 -6, 0 0 Z"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <!-- Hoja Superior Derecha (+38 deg) -->
            <g transform="translate(24, 24) rotate(38) translate(0, -2)">
              <path
                d="M 0 0 C -5 -6, -6 -13, 0 -19 C 6 -13, 5 -6, 0 0 Z"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <!-- Hoja Inferior Derecha (+142 deg) -->
            <g transform="translate(24, 24) rotate(142) translate(0, -2)">
              <path
                d="M 0 0 C -5 -6, -6 -13, 0 -19 C 6 -13, 5 -6, 0 0 Z"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <!-- Hoja Inferior Izquierda (-142 deg) -->
            <g transform="translate(24, 24) rotate(-142) translate(0, -2)">
              <path
                d="M 0 0 C -5 -6, -6 -13, 0 -19 C 6 -13, 5 -6, 0 0 Z"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
        </div>
        <p>Cargando Beauty Space...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
